global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: financial-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
        labels:
          service: financial-api-platform

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
