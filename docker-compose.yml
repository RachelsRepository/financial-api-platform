x-app-env: &app-env
  NODE_ENV: development
  APP_PORT: 3000
  LOG_LEVEL: info
  TRUSTED_HOSTS: localhost,127.0.0.1,api
  DATABASE_URL: postgresql://fap:fap_dev_secret@postgres:5432/financial_api?schema=public
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_CLIENT_ID: financial-api-platform
  KAFKA_OUTBOX_TOPIC: financial.events
  KAFKA_DLQ_TOPIC: financial.events.dlq
  TOKEN_ISSUER: https://localhost:3000
  TOKEN_AUDIENCE: financial-api
  ACCESS_TOKEN_TTL_SECONDS: 300
  REFRESH_TOKEN_TTL_SECONDS: 86400
  AUTHORIZATION_CODE_TTL_SECONDS: 60
  CLOCK_SKEW_SECONDS: 30
  # JWT_* values are loaded from .env.docker (see scripts/ensure-compose-env.mjs).
  ENABLE_SWAGGER: 'true'
  ENABLE_AUDIT: 'true'
  ENABLE_PROVIDER_SANDBOX: 'true'
  RATE_LIMIT_WINDOW_MS: 60000
  RATE_LIMIT_MAX: 100
  MTLS_REQUIRED: 'false'
  OTEL_ENABLED: 'true'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  METRICS_ENABLED: 'true'
  ENABLE_WORKERS: 'false'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fap
      POSTGRES_PASSWORD: fap_dev_secret
      POSTGRES_DB: financial_api
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fap -d financial_api']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # JVM image retained for local topic tooling/healthchecks (native image lacks kafka-topics.sh).
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - '9092:9092'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic financial.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic financial.events.dlq --partitions 1 --replication-factor 1
        echo "Kafka topics initialized"

  migrate:
    build:
      context: .
      target: build
    env_file:
      - .env.docker
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ['/bin/sh', '-c', 'pnpm prisma migrate deploy && pnpm prisma db seed']
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env.docker
    environment:
      <<: *app-env
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      target: runtime
    env_file:
      - .env.docker
    environment:
      <<: *app-env
      ENABLE_WORKERS: 'true'
      WORKER_HEARTBEAT_PATH: /tmp/fap-worker-heartbeat
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: '30'
    command: ['node', 'dist/interfaces/workers/main.js']
    # Override the image HTTP HEALTHCHECK — the worker has no HTTP server.
    # Health is a fresh heartbeat file written after PostgreSQL/Redis/Kafka probes.
    healthcheck:
      test: ['CMD-SHELL', '/bin/sh /app/scripts/worker-healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      api:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8888:8888'
      - '8889:8889'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
